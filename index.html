<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #quick-links-section {
      margin-bottom: 30px;
    }
    #quick-links-container {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .quick-link {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
      color: #333;
      text-decoration: none;
      font-size: 0.95rem;
      user-select: none;
    }
    .quick-link:hover {
      background: #f0f0f0;
    }
    .quick-link-add {
      width: 28px;
      height: 28px;
      border: 2px solid #ccc;
      border-radius: 50%;
      background: #f9f9f9;
      color: #666;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease;
    }
    .quick-link-add:hover {
      border-color: #999;
    }
    #queue-container {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }
    .video-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .video-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }
    .video-card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }
    .video-card h3 {
      font-size: 0.9rem;
      margin: 10px 0 0;
      line-height: 1.3;
      min-height: 3.9em;
      overflow: hidden;
    }
    p { margin: 0; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <h1 style="margin: 0;">Home</h1>
      <button id="clear-viewed-btn" style="background:#ef4444;color:#fff;border:none;padding:8px 10px;border-radius:4px;cursor:pointer;">Clear viewed</button>
    </div>
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="favorites.html" style="padding: 8px 12px; background:#fff; border:1px solid #ddd; border-radius:4px; text-decoration:none; color:#111;">Favorites</a>
      <a href="yoga.html" style="padding: 8px 16px; background: #1f2937; color: white; text-decoration: none; border-radius: 4px;">Yoga Page</a>
    </div>
  </div>
  <div id="quick-links-section">
    <div id="quick-links-container">
      <button id="quick-link-add-btn" class="quick-link-add" title="Add new link">+</button>
    </div>
  </div>
  <div id="queue-container">
    <!-- Queue items will be inserted here by queue.js -->
  </div>
  <!-- Reload the queue page after adding videos to ensure the latest items are shown -->
  <script src="queue.js"></script>
  <script>
    const btn = document.getElementById('clear-viewed-btn');
    if (btn && typeof clearViewed === 'function') {
      btn.addEventListener('click', function() {
        if (confirm('Remove all viewed items from the queue?')) {
          clearViewed('queue');
        }
      });
    }
    if (typeof displayVideos === 'function') {
      displayVideos('queue');
    }
    if (typeof initializeQuickLinks === 'function') {
      initializeQuickLinks();
    }
  </script>
</body>
</html>
