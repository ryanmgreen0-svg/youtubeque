<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    a.button { padding: 8px 16px; background:#fff; border:1px solid #ddd; border-radius:4px; text-decoration:none; color:#111; margin-right:12px; }
  </style>
</head>
<body data-collection="favorites">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <h1 style="margin:0;">Favorites</h1>
      <button id="clear-viewed-btn" style="background:#ef4444;color:#fff;border:none;padding:8px 10px;border-radius:4px;cursor:pointer;">Clear viewed</button>
    </div>
    <div>
      <a href="/youtubeque/index.html" class="button">Home</a>
      <a href="/youtubeque/yoga.html" class="button">Yoga Page</a>
    </div>
  </div>

  <div id="queue-container">
    <!-- Favorites will be rendered here by queue.js -->
  </div>

  <script src="/youtubeque/queue.js"></script>
  <script>
    const btn = document.getElementById('clear-viewed-btn');
    if (btn && typeof clearViewed === 'function') {
      btn.addEventListener('click', function() {
        if (confirm('Remove all viewed items from favorites?')) {
          clearViewed('favorites');
        }
      });
    }
    if (typeof displayVideos === 'function') {
      displayVideos('favorites');
    }
  </script>
</body>
</html>
